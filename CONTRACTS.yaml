# CONTRACTS.yaml — superficie de contrato de paseo-plan.
#
# Lo existente NO muta. Breaking = entrada nueva `.vN+1`, la vieja a `status: deprecated` con `replaced_by` +
# `remove_after`. Las entradas nunca se borran (retirar = `status: removed`). Un commit que toca superficie de contrato
# actualiza el registro en el mismo push y lleva el trailer `Contract-Change: <accion> <id>`. Reglas: skill
# `synapse-contracts`.
version: 1
canonical_checkout: ~/src/paseo-plan
registry_files:
  - CONTRACTS.yaml
contracts:
  - id: file.paseo-plan.anchor.v1
    kind: file-schema
    value: ".local/state/paseo-plan/anchor-<agentId>.json"
    role: provider
    files:
      - server/anchor.ts
      - shared/anchor.ts
    status: active
    note: >-
      SC-4804 (08-11-2026): el ancla del plan de un agente de Paseo, una por agente (`<agentId>` = id del agente,
      ^[\w-]{1,128}$). La escribe el server de este plugin al empezar y al acabar cada turno de un agente Claude, con
      rename atómico, y el botón «Garantizar plan» de la pastilla cambia `guard`. JSON {ticketKey: string|null,
      objetivo: string, criterios: [{texto, como_se_verifica, status: abierta|verificada, evidencia: string}],
      fuera_de_alcance: [string], guard: boolean}. `guard` se conserva al refrescar y no se enciende con 0 criterios.
      Con ticket, criterios, `status` y `evidencia` salen de `jira_rest.py criterios <KEY>` (cli.jira-rest.criterios.v1 de
      x86-host-runtime, el mismo lector que el gate de Done), y `objetivo` nunca va vacío: el `## Objetivo` de la
      descripción, si no el del spec, si no el resumen.
      `ticketKey`: la del worktree, si no la de la rama, si no la primera del primer prompt sin el marcado de sus etiquetas
      (el `source-agent-title` de un prompt que envía otra sesión no es el ticket de esta). Forma sin cambios.
      Consumidores: paseo-sugiere `server/suggest.ts` (anchorOf/guardedPlan/anchorKey; con `guard:true` y criterios
      manda el ancla en `contexto.plan`, docs/servicio-sugiere.md §2) y el Stop hook de SC-4806 (claude-harness, por
      `$PASEO_AGENT_ID`).
